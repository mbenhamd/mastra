name: mastra-workflow-tests

services:
  inngest-test:
    image: inngest/inngest:v1.34.0
    container_name: mastra-inngest-test
    # Match the isolated package-suite handler port.
    # Auto-discovery will find the handler when running on host.docker.internal
    command: inngest dev -p 4200 -u http://host.docker.internal:4201/inngest/api --poll-interval=1
    ports:
      - '4200:4200'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
