name: Labeler

permissions:
  contents: read
  pull-requests: write

on:
  - pull_request_target

jobs:
  labeler:
    # pull_request_target checks out the trusted default branch below. Keep the
    # fork independent from upstream infrastructure without changing upstream.
    runs-on: ${{ (github.repository == 'mbenhamd/mastra' || github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || 'starsling-ubuntu-24.04' }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          fetch-tags: false
          filter: 'blob:none'
          show-progress: false
      - uses: actions/labeler@v6
