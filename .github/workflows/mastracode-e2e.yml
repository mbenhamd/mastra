name: Mastra Code E2E

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_TEAM:
        required: false
  # In the canonical repository this suite is invoked by prebuild's targeted
  # validator via workflow_call. On the fork, PR runs stay disabled so core-only
  # fork PRs do not inherit unrelated package-build failures from the fork
  # baseline; manual dispatch remains available as a diagnostic lane.
  workflow_dispatch:

permissions: {}

jobs:
  mastracode-e2e:
    name: Mastra Code E2E
    # Fork and external PR code must run on an ephemeral GitHub-hosted runner.
    # Preserve Starsling only for trusted same-repository canonical branches.
    runs-on: ${{ (github.repository == 'mastra-ai/mastra' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'starsling-ubuntu-24.04' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: ${{ secrets.TURBO_TOKEN == '' && 'local:rw' || 'remote:rw' }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        timeout-minutes: 20
        with:
          ref: ${{ inputs.head_sha }}

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Cache turbo build setup
        if: ${{ env.TURBO_TOKEN == '' }}
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build Mastra Code
        run: pnpm run build:mastracode

      - name: Run Mastra Code E2E
        run: pnpm --filter ./mastracode/tui run e2e:test -- --reporter=dot
